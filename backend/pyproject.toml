[project]
name = "amaryeducar-api"
version = "1.0.0"
description = "Backend FastAPI de Olimpiadas Matemáticas Amar y Educar 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"